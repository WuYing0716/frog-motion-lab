<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>蛙后肢电刺激实验</title>
<meta name="description" content="单肌标本的教学示意转角，腓肠肌组后提约 40°，胫骨前肌组上踢约 32°。">
<style>
:root{color-scheme:light;--bg:#f1f0e8;--paper:#fffdf4;--ink:#20352c;--quiet:#51685c;--line:#d4d8cd;--accent:#205647;font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink)}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation;min-height:44px}button:focus-visible{outline:3px solid #a95c29;outline-offset:3px}button:disabled{opacity:.55;cursor:default}
.shell{width:min(1480px,100%,max(990px,calc((100svh - 180px)*16/9 + 282px)));margin:auto;padding:clamp(12px,2.9vw,38px)}
header{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding:0 0 18px;border-bottom:1px solid var(--line);margin-bottom:16px}
p,h1,h2{margin:0}.context{color:var(--accent);font-weight:700;font-size:14px}h1{font-size:clamp(24px,3.1vw,44px);line-height:1.18;margin-top:7px;letter-spacing:-.035em}
.layout{display:grid;grid-template-columns:195px minmax(0,1fr);gap:14px;align-items:start}
.tools,.lab{background:var(--paper);border:1px solid var(--line);border-radius:13px}
.tools{padding:15px 13px}.tools h2{font-size:16px;margin:0 0 12px 3px}
.items{display:grid;gap:9px}
.item,.btn{border:1px solid var(--line);background:#faf9f1;border-radius:9px;font-weight:680}
.item{width:100%;height:63px;text-align:left;padding:8px;display:flex;align-items:center;gap:9px;touch-action:none}
.item[aria-pressed=true]{border-color:var(--accent);background:#e1ece3;box-shadow:inset 3px 0 var(--accent)}
.icon{width:50px;height:36px;flex:none;position:relative;pointer-events:none}
.icon img{width:100%;height:100%;object-fit:contain}
.help{font-size:13px;line-height:1.55;color:var(--quiet);margin:12px 2px 0}
.controls{display:grid;gap:8px;margin-top:14px;padding-top:14px;border-top:1px solid var(--line)}
.btn{padding:7px 12px;white-space:nowrap}
.lab{overflow:hidden}.lab h2{font-size:17px;padding:13px 15px}
.stage{width:100%;aspect-ratio:16/9;position:relative;touch-action:pan-y;overflow:hidden;isolation:isolate;background:#f1e3cc}
.stage[data-tool]:not([data-tool=""]){touch-action:none;cursor:crosshair}
#scene{width:100%;height:100%;position:absolute;inset:0;object-fit:fill;pointer-events:none;user-select:none}
#probe{z-index:2;position:absolute;width:13.828125%;height:33.055556%;min-height:0;padding:0;border:0;background:none;transform:translate(-15.25%,-7.56%);cursor:grab;touch-action:none;user-select:none}
#probe img{display:block;width:100%;height:100%;pointer-events:none}#probe>*{pointer-events:none}
.dragging,.dragging #probe{cursor:grabbing!important}
[hidden]{display:none!important}
.knife{position:absolute;left:15.25%;top:7.56%;height:88%;width:16%;transform-origin:50% 0;transform:translateX(-50%) rotate(-30deg);filter:drop-shadow(1px 1px 0 #463d3460)}
.knife:before,.knife:after{content:"";position:absolute;display:block;width:100%;left:0}
.knife:before{height:34%;top:0;clip-path:polygon(43% 0,100% 45%,87% 100%,7% 100%,8% 56%);background:linear-gradient(90deg,#687778,#e8eeee 45%,#819a9a 72%,#526666)}
.knife:after{top:30%;height:69%;border-radius:1px 1px 5px 5px;background:repeating-linear-gradient(180deg,transparent 0 8%,#34474942 9% 11%,transparent 12% 16%),linear-gradient(90deg,#5a6969,#c6d0ca 38%,#84948f 75%,#4a5b58)}
.icon .knife{left:44%;top:5%;height:112%;width:13%;transform:translateX(-50%) rotate(-48deg)}
.spark{z-index:3;position:absolute;pointer-events:none;transform:translate(-50%,-50%);color:#fff8cb;text-shadow:0 0 5px #a14a07,0 0 10px #f1a139;font-size:clamp(14px,2.1vw,24px);opacity:0}
.spark.pulse{animation:flash .27s ease-out}@keyframes flash{0%,36%{opacity:1}100%{opacity:0}}
.cut-mark{position:absolute;width:3.2%;height:2px;background:#bd805a;pointer-events:none;z-index:2;opacity:0;transform:translate(-50%,-50%) rotate(-38deg)}
.cut-mark.pulse{animation:flash .23s ease-out}
body.project .shell{padding-top:10px}body.project header{padding-bottom:10px;margin-bottom:10px}body.project .context,body.project .help{display:none}
@media(max-width:820px){.layout{grid-template-columns:142px minmax(0,1fr);gap:9px}.tools{padding:11px 9px}.icon{width:37px}.item{font-size:14px;gap:4px}.btn{font-size:13px}.lab h2{padding:10px 12px}}
@media (max-width:700px), (max-width:1100px) and (orientation:portrait){
  .shell{padding:clamp(10px,2.2vw,24px)}
  .layout{grid-template-columns:minmax(0,1fr);gap:10px}
  .tools{
    display:grid;grid-template-columns:minmax(0,1fr) auto;
    grid-template-areas:"heading heading" "items controls" "help help";
    align-items:center;gap:8px 12px;padding:10px
  }
  .tools h2{grid-area:heading;margin:0}
  .items{grid-area:items}
  .controls{grid-area:controls;border-top:0;margin:0;padding:0}
  .items,.controls{grid-template-columns:repeat(2,minmax(0,1fr))}
  .item{height:52px}
  .help{grid-area:help;margin:0}
  .lab h2{padding:10px 12px}
}
@media (max-width:590px){
  .shell{padding:10px}
  header{align-items:flex-start;margin-bottom:8px;padding-bottom:10px}
  .context{font-size:12px}
  .tools{grid-template-columns:minmax(0,1fr);grid-template-areas:"items" "controls" "help"}
  .tools h2{display:none}
  .item{height:48px}
}
@media(prefers-reduced-motion:reduce){.spark.pulse,.cut-mark.pulse{animation:none;opacity:1}}
</style>
</head>

<div class="shell">
<header><div><h1>蛙后肢电刺激实验</h1><p class="context"> 人体的运动 · 苏中附校 吴颖 </p></div><button id="project" class="btn" aria-pressed="false">投影模式</button></header>
<main class="layout">
<aside class="tools" aria-label="实验器材">
<h2>实验器材</h2>
<div class="items">
<button class="item" data-tool="bow" aria-pressed="false"><span class="icon"><img id="bowIcon" alt=""></span>锌铜弓</button>

</div>
<p class="help">先点选器材，再点按标本。也可以拖动器材，用尖端接触标本。</p>
<div class="controls"><button class="btn" id="reset" disabled>手动复位</button><button class="btn" id="new">更换标本</button></div>
</aside>
<section class="lab" aria-label="蛙后肢标本"><h2>蛙后肢标本</h2>
<div id="stage" class="stage" data-tool="">
<img id="scene" alt="软木板上的蛙后肢，标出了腓肠肌、胫骨前肌、坐骨神经和踝关节。">
<button id="probe" type="button" aria-label="拖动选中的器材" hidden><img id="probeImg" draggable="false" alt=""><i id="blade" class="knife" aria-hidden="true" hidden></i></button>
<span id="spark" class="spark" aria-hidden="true">✦</span><i id="cut" class="cut-mark" aria-hidden="true"></i>
</div></section>
</main>
</div>

const [stage,scene,probe,spark,cut]=["stage","scene","probe","spark","cut"].map($);
const tools=[...document.querySelectorAll(".item")];
const dock={x:1050,y:430};
const trace=[[893,354],[921,351],[952,340],[978,322],[999,306],[1024,291],[1048,276],[1074,259],[1109,235]];
const anatomy={A:[[551,453],[650,440],[780,429],[872,419]],B:[[551,318],[650,323],[780,332],[872,338]]};
let muscles="both", bent=false, tool="", tip=dock, drag=null, follow=false, timer=0, flashTimer=0, anim=null, settling=false;
const reduced=matchMedia("(prefers-reduced-motion:reduce)");
$("bowIcon").src=assets.bow;
$("probeImg").src=assets.probe;
function image(key){
  const src=assets[key];
  if (scene.getAttribute("src")!==src) scene.src=src;
}
function paintLimb(){
  image(muscles==="both" || muscles==="none" ? muscles : muscles+(bent ? "1" : "0"));
  const names={both:"腓肠肌、胫骨前肌",A:"腓肠肌",B:"胫骨前肌",none:"骨骼"};
  scene.alt="蛙后肢标本，保留"+names[muscles]+"及坐骨神经，图中标出踝关节。";
  $("reset").disabled=!bent;
}
function paintTool(){
  stage.dataset.tool=tool;
  tools.forEach(button=>button.setAttribute("aria-pressed",String(button.dataset.tool===tool)));
  probe.hidden=!tool;
  $("probeImg").hidden=tool!=="bow";
  $("blade").hidden=tool!=="knife";
  probe.setAttribute("aria-label",tool==="bow"?"拖动锌铜弓":"拖动解剖刀");
  place(probe,tip);
}
function place(element,point){
  element.style.left=(point.x/12.8)+"%";
  element.style.top=(point.y/7.2)+"%";
}
function local(event){
  const box=stage.getBoundingClientRect();
  return {x:(event.clientX-box.left)*1280/box.width,y:(event.clientY-box.top)*720/box.height};
}
function inside(p){return p.x>=0 && p.x<=1280 && p.y>=0 && p.y<=720;}
function near(line,p,width){
  return line.slice(1).some(([x,y],i)=>{
    const [x0,y0]=line[i],dx=x-x0,dy=y-y0;
    const t=Math.max(0,Math.min(1,((p.x-x0)*dx+(p.y-y0)*dy)/(dx*dx+dy*dy)));
    return Math.hypot(p.x-x0-t*dx,p.y-y0-t*dy)<=width;
  });
}
function light(element,point){
  spark.classList.remove("pulse"); cut.classList.remove("pulse");
  place(element,point); void element.offsetWidth; element.classList.add("pulse");
  clearTimeout(flashTimer);
  flashTimer=setTimeout(()=>element.classList.remove("pulse"),295);
}
function stopMotion(){
  clearTimeout(timer); anim?.cancel(); anim=null; settling=false;
}
function twitch(key){
  image(key);
  timer=setTimeout(()=>{
    paintLimb();
    timer=setTimeout(()=>{image(key);timer=setTimeout(paintLimb,65);},55);
  },65);
}
function stimulate(point){
  light(spark,point);
  if(muscles==="none" || settling) return;
  stopMotion();
  if(muscles==="both"){
    if(reduced.matches) return;
    if(assets["both-twitch"]) {twitch("both-twitch");return;}
    anim=scene.animate([
      {transform:"translate(0,0)"},{transform:"translate(1.1%,-.8%)"},
      {transform:"translate(-.85%,.6%)"},{transform:"translate(.5%,-.3%)"},{transform:"translate(0,0)"}
    ],{duration:185,easing:"ease-out"});
    return;
  }
  if(bent){
    if(!reduced.matches) twitch(muscles+"toe");
    return;
  }
  bent=true;
  $("reset").disabled=false;
  if(reduced.matches){paintLimb();return;}
  settling=true;
  let step=1;
  const intervals=[38,42,50,52];
  function contract(){
    if(step>intervals.length){
      settling=false;
      paintLimb();
      return;
    }
    image(muscles+"motion"+step);
    timer=setTimeout(contract,intervals[step-1]);
    step++;
  }
  contract();
}
function contact(point,pointerType){
  if(!inside(point)) return;
  if(tool==="bow"){
    const width=pointerType==="touch"?Math.min(31,Math.max(15,8*1280/stage.clientWidth)):14;
    if(near(trace,point,width)) stimulate(point);
    return;
  }
  for(const name of ["A","B"]){
    if((muscles==="both"||muscles===name)&&near(anatomy[name],point,26)){
      stopMotion(); bent=false;
      muscles=muscles==="both"?(name==="A"?"B":"A"):"none";
      paintLimb(); light(cut,point); return;
    }
  }
}
function pick(name,hover){
  tool=name; follow=hover; tip=dock; paintTool();
}
function begin(event,fromTools=""){
  if(drag || !event.isPrimary || (event.pointerType==="mouse"&&event.button!==0)) return;
  const grip=!fromTools&&probe.contains(event.target),p=local(event);
  if(!tool&&!fromTools) return;
  if(fromTools) pick(fromTools,event.pointerType==="mouse");
  drag={id:event.pointerId,fromTools,grip,x:event.clientX,y:event.clientY,dx:tip.x-p.x,dy:tip.y-p.y,initial:tip};
  if(!fromTools&&!grip) {tip=p;paintTool();}
  stage.classList.add("dragging");
  stage.setPointerCapture(event.pointerId);
  event.preventDefault();
}
function pointFor(event,gesture){
  const p=local(event);
  return gesture.grip?{x:p.x+gesture.dx,y:p.y+gesture.dy}:p;
}
function end(event,cancelled=false){
  if(drag?.id!==event.pointerId) return;
  const gesture=drag;
  drag=null;
  stage.classList.remove("dragging");
  if(cancelled){tip=gesture.initial;paintTool();return;}
  const moved=Math.hypot(event.clientX-gesture.x,event.clientY-gesture.y)>4;
  const p=local(event);
  if(gesture.fromTools&&!inside(p)) return;
  if(gesture.grip&&moved) follow=false;
  tip=gesture.grip&&moved?pointFor(event,gesture):p;
  if(!inside(tip)){tip=dock;paintTool();return;}
  paintTool();
  contact(tip,event.pointerType);
}
tools.forEach(button=>{
  button.addEventListener("pointerdown",e=>begin(e,button.dataset.tool));
  button.addEventListener("click",e=>{if(e.detail===0)pick(button.dataset.tool,false);});
});
stage.addEventListener("pointerdown",e=>begin(e));
stage.addEventListener("pointermove",e=>{
  if(drag?.id===e.pointerId){
    const p=pointFor(e,drag);
    if(!drag.fromTools||inside(p)) {tip=p;paintTool();}
  }else if(tool&&follow&&e.pointerType==="mouse"&&!drag){
    tip=local(e);paintTool();
  }
});
stage.addEventListener("pointerup",e=>end(e));
stage.addEventListener("pointercancel",e=>end(e,true));
stage.addEventListener("lostpointercapture",e=>end(e,true));
probe.addEventListener("keydown",event=>{
  const arrows={ArrowLeft:[-12,0],ArrowRight:[12,0],ArrowUp:[0,-12],ArrowDown:[0,12]};
  if(arrows[event.key]){
    event.preventDefault();
    const [dx,dy]=arrows[event.key];
    tip={x:Math.max(0,Math.min(1280,tip.x+dx)),y:Math.max(0,Math.min(720,tip.y+dy))};
    paintTool();
  }else if(event.key==="Enter"||event.key===" "){event.preventDefault();contact(tip,"");}
});
$("reset").addEventListener("click",()=>{stopMotion();bent=false;paintLimb();});
$("new").addEventListener("click",()=>{
  stopMotion();clearTimeout(flashTimer);spark.classList.remove("pulse"); cut.classList.remove("pulse");
  muscles="both";bent=false;drag=null;stage.classList.remove("dragging");pick("",false);paintLimb();
});
$("project").addEventListener("click",()=>{
  const on=document.body.classList.toggle("project");
  $("project").setAttribute("aria-pressed",String(on));
  $("project").textContent=on?"退出投影模式":"投影模式";
});
paintLimb();
for(const [name,src] of Object.entries(assets)){
  if(name==="bow"||name==="probe") continue;
  const img=new Image();img.src=src;
}
</script>
